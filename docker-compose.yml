services:
  rag-api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [minio, opensearch, ollama, chroma]
    read_only: true
    tmpfs: [/tmp]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set in .env}"
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment: ["discovery.type=single-node", "DISABLE_SECURITY_PLUGIN=true", "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"]
    volumes: [os_data:/usr/share/opensearch/data]
    ports: ["9200:9200"]
  ollama:
    image: ollama/ollama:0.5.4
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
  chroma:
    image: chromadb/chroma:0.5.23
    volumes: [chroma_data:/chroma/chroma]
    ports: ["8001:8000"]
  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes: [kafka_data:/bitnami/kafka]
  spark:
    image: bitnami/spark:3.5
    depends_on: [kafka, minio]
    volumes:
      - ./streaming:/opt/bitnami/spark/jobs:ro
    command: >
      /opt/bitnami/spark/bin/spark-submit
      /opt/bitnami/spark/jobs/spark_job.py
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
volumes: {minio_data: {}, os_data: {}, ollama_data: {}, chroma_data: {}, kafka_data: {}}
