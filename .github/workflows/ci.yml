name: Test, build and security gates

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_PROFILE: test
  ANONYMIZED_TELEMETRY: "False"
  BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Assert supported Python runtime
        run: |
          python -c "import sys; assert sys.version_info[:2] in ((3, 12), (3, 13)), sys.version"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.19.0
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip check
      - name: Verify optional adapter imports
        run: python -m ops.verify_adapters --profile lab
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Verify downstream failure lifecycle
        run: python -m pytest -v tests/chaos/test_lifecycle_downstream_failure.py
      - run: python -m ops.smoke_test
      - name: Compare six profiles with the captured PR base
        run: python -m ops.helm_contract --base-ref "$BASE_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/

  infrastructure-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.19.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: 1.11.4
      - run: python -m pip install --require-hashes -r ansible/requirements-controller.txt
      - name: Lint Ansible and YAML
        run: |
          # Start with the portable minimum profile; stricter policy rules are
          # incrementally enabled as the legacy lab play is refactored.
          ansible-lint --offline --profile=min playbook.yaml ansible
          # Helm templates are rendered and schema-checked below; lint the
          # controller/CI YAML as YAML rather than treating Go templates as it.
          yamllint -c .yamllint playbook.yaml ansible deploy/*.yaml .github/workflows
      - name: Validate Ansible and render Helm charts
        run: |
          ansible-playbook -i inventory.ini playbook.yaml --syntax-check
          ansible-playbook -i inventory.ini ansible/configure-mesh.yaml --syntax-check
          ansible-playbook -i inventory.ini ansible/deploy-rag.yaml --syntax-check
          helm lint deploy/lab-infra
          helm lint rag-chart -f deploy/lab-values.yaml
          helm lint rag-chart -f deploy/gcp-values.yaml --set ragApi.image.tag=validation-image
          mkdir -p test-results
          helm template rag-infra deploy/lab-infra -n rag > test-results/infrastructure.yaml
          helm template rag rag-chart -n rag -f deploy/lab-values.yaml > test-results/application.yaml
          helm template strimzi strimzi-kafka-operator --repo https://strimzi.io/charts/ --version 0.51.0 --include-crds > test-results/strimzi-crds.yaml
          python -m ops.validate_kafka_manifests test-results/infrastructure.yaml test-results/strimzi-crds.yaml
      - name: Validate the rendered kubeadm configuration with kubeadm dry-run
        run: |
          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update
          sudo apt-get install -y kubeadm
          ansible localhost -c local -m ansible.builtin.template \
            -a 'src=ansible/templates/kubeadm-init.yaml.j2 dest=test-results/kubeadm-init.yaml mode=0600' \
            -e 'ansible_host=127.0.0.1 kubernetes_control_plane_endpoint=127.0.0.1:6443 kubernetes_pod_subnet=10.244.0.0/16 kubernetes_service_subnet=10.96.0.0/12 kubernetes_control_plane_host=127.0.0.1'
          sudo kubeadm init --dry-run --config test-results/kubeadm-init.yaml --ignore-preflight-errors=all
      - name: Format and validate Terraform starters
        run: |
          terraform -chdir=terraform/aws fmt -check
          terraform -chdir=terraform/aws init -backend=false -input=false
          terraform -chdir=terraform/aws validate
          terraform -chdir=terraform/azure fmt -check
          terraform -chdir=terraform/azure init -backend=false -input=false
          terraform -chdir=terraform/azure validate
          terraform -chdir=terraform/gcp fmt -check
          terraform -chdir=terraform/gcp init -backend=false -input=false
          terraform -chdir=terraform/gcp validate
      - name: Validate Kubernetes schemas
        run: |
          mkdir -p "$RUNNER_TEMP/kubeconform"
          cd "$RUNNER_TEMP/kubeconform"
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/CHECKSUMS
          sha256sum --check --ignore-missing CHECKSUMS
          tar -xzf kubeconform-linux-amd64.tar.gz
          ./kubeconform -strict -summary -skip Kafka,KafkaNodePool "$GITHUB_WORKSPACE/test-results/infrastructure.yaml" "$GITHUB_WORKSPACE/test-results/application.yaml"
      - name: Validate raw Kubernetes and mesh manifests
        run: |
          "$RUNNER_TEMP/kubeconform/kubeconform" -strict -ignore-missing-schemas -summary \
            $(find k8s waf -type f \( -name '*.yaml' -o -name '*.yml' \) -print)
      - name: Server-validate rendered Helm resources on Kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3  # v1.12.0
      - name: Apply rendered contract to the disposable Kind API server
        run: |
          kubectl apply --server-side --dry-run=server -f test-results/application.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: rendered-lab-manifests
          path: test-results/

  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, infrastructure-validation]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .tools/supply-chain-state.json
            .tools/grype-db
            .tools/scanners
          key: o0-scan-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            o0-scan-${{ github.ref_name }}-
            o0-scan-main-
      - name: Build image
        run: |
          docker build --build-arg PROFILE=main --tag local/omni-o0:main .
          docker build --build-arg PROFILE=lab --tag local/omni-o0:lab .
      - name: Verify split adapters and collect image inventory
        run: |
          python -m ops.collect_image_evidence
          python -m ops.image_inventory --inventory test-results/o0-baseline/main-licenses.json --profile main --check THIRD-PARTY.md
          python -m ops.image_inventory --inventory test-results/o0-baseline/lab-licenses.json --profile lab --check THIRD-PARTY.md
      - name: Smoke test container
        run: python -m ops.container_smoke --image local/omni-o0:main
      - name: Build the PR base for vulnerability comparison
        run: python -m ops.build_baseline --base-ref "$BASE_REF"
      - name: Scan image SBOM and hash locks under ADR-0049
        run: |
          BASE_IMAGE="local/omni-o0-baseline:$(git rev-parse --short=12 "$BASE_REF")"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' local/omni-o0:main)"
          python -m ops.supply_chain --image docker:local/omni-o0:main --image-digest "$IMAGE_ID" \
            --baseline-image "docker:$BASE_IMAGE" --base-ref "$BASE_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: o0-image-and-supply-chain-evidence
          path: |
            test-results/o0-baseline/*-pip-list.json
            test-results/o0-baseline/*-licenses.json
            test-results/o0-baseline/images.json
            test-results/supply-chain/
