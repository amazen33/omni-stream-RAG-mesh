name: Test, Build, Scan & GitOps Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Unit & Chaos Failure Survival Tests
        run: |
          python -m unittest discover -s tests -v

  build:
    name: 🐳 Multi-Stage Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Optimize Microservice Container
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: ghcr.io/amazen33/fastapi-rag-service:1.1.0
          load: true

      - name: Verify Non-Root User & Image Attributes
        run: |
          docker run --rm ghcr.io/amazen33/fastapi-rag-service:1.1.0 python -c "
          import os
          print(f'Runtime effective UID: {os.getuid()}')
          assert os.getuid() == 10001, 'Image must run as non-root UID 10001'
          print('Non-root verification PASSED.')
          "

  scan:
    name: 🛡️ Security Vulnerability & Code Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners (Bandit & Safety)
        run: |
          pip install bandit safety

      - name: Run Bandit Static Application Security Testing (SAST)
        run: |
          bandit -r app/ -ll || true

      - name: Run Dependency Vulnerability Scan
        run: |
          safety check -r app/requirements.txt || true

  gitops-verification:
