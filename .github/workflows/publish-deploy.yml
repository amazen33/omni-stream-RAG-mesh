name: Publish and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image through the reviewed Helm chart
        type: boolean
        default: false
      deployment_profile:
        description: Target values overlay (must match the prepared cluster)
        type: choice
        default: generic
        options: [generic, onprem, aws, azure]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Define image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}
      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push scanned image
        run: docker push "${{ steps.meta.outputs.image }}"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "KUBE_CONFIG production secret is required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
      - name: Upgrade with the versioned Helm deployment contract
        env:
          KUBECONFIG: ${{ runner.temp }}/kube/config
          IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          IMAGE_REPOSITORY="${IMAGE%:*}"
          IMAGE_TAG="${IMAGE##*:}"
          kubectl -n rag get secret rag-secrets -o jsonpath='{.data.PII_TOKEN_SALT}' | grep -q .
          helm upgrade --install rag ./rag-chart --namespace rag --create-namespace \
            -f "deploy/${DEPLOYMENT_PROFILE}-values.yaml" \
            --set "ragApi.image.repository=${IMAGE_REPOSITORY}" \
            --set "ragApi.image.tag=${IMAGE_TAG}" \
            --wait --timeout 10m
          kubectl -n rag rollout status deployment/rag-api --timeout=180s
