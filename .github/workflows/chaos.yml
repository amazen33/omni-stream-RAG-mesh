name: Retrieval resilience checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  failure-injection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert supported Python runtime
        run: |
          python -c "import sys; assert sys.version_info[:2] in ((3, 12), (3, 13)), sys.version"
      - run: python -m pip install -r requirements.txt
      - name: Run downstream failure lifecycle and resilience injection
        run: python -m pytest -v tests/chaos
