name: Retrieval resilience checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  RUNTIME_PROFILE: test
  ANONYMIZED_TELEMETRY: "False"

jobs:
  failure-injection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert supported Python runtime
        run: |
          python -c "import sys; assert sys.version_info[:2] in ((3, 12), (3, 13)), sys.version"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run downstream failure lifecycle and resilience injection
        run: python -m pytest -v tests/chaos
