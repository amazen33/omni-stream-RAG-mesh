services:
  rag-api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [minio, opensearch, ollama, chroma]
    read_only: true
    tmpfs: [/tmp]
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z # If Quay still caches mirrors, or switch to alternative
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set in .env}"
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment: ["discovery.type=single-node", "DISABLE_SECURITY_PLUGIN=true", "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"]
    volumes: [os_data:/usr/share/opensearch/data]
    ports: ["9200:9200"]
  ollama:
    image: ollama/ollama:0.5.4
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
  chroma:
    image: chromadb/chroma:0.5.23
    volumes: [chroma_data:/chroma/chroma]
    ports: ["8001:8000"]
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka_data:/var/lib/kafka/data]
    ports: ["9092:9092"]
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rag_db
    command: postgres -c wal_level=logical
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8081:8081"]

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "${TIMESCALEDB_PASSWORD:?set in .env}"
      POSTGRES_DB: rag_analytics
    volumes: [timescaledb_data:/var/lib/postgresql/data]
    ports: ["5433:5432"]

  eventstoredb:
    image: eventstore/eventstore:24.10.0-jammy
    environment:
      EVENTSTORE_CLUSTER_SIZE: "1"
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      # Local-only convenience. Kubernetes deployment requires TLS and
      # credentials supplied by the platform security configuration.
      EVENTSTORE_INSECURE: "true"
    volumes: [eventstoredb_data:/var/lib/eventstore]
    ports: ["2113:2113", "1113:1113"]

  debezium:
    image: debezium/connect:2.7.0.Final
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium_connect_group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on: [kafka, postgres]

  kafka-mirror:
    image: apache/kafka:3.9.0
    command: >
      /opt/kafka/bin/connect-mirror-maker.sh
      --launcher.threads 1
      --config /opt/kafka/config/mirror-maker.properties
    depends_on: [kafka]
    volumes:
      - ./streaming/mirror-maker.properties:/opt/kafka/config/mirror-maker.properties:ro
  spark:
    image: apache/spark:3.5.0
    depends_on: [kafka, minio]
    volumes:
      - ./streaming:/opt/spark/jobs:ro
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      /opt/spark/jobs/spark_job.py
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:3.4.2
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki

  tempo:
    image: grafana/tempo:2.7.2
    ports: ["3200:3200"]
    command: [ "-config.file=/etc/tempo.yaml" ]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [tempo]
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
      
volumes:
  os_data: {}
  ollama_data: {}
  chroma_data: {}
  kafka_data: {}
  postgres_data: {}
  timescaledb_data: {}
  eventstoredb_data: {}
  grafana_data: {}
  loki_data: {}
  prom_data: {}
  minio_data: {}
