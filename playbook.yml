---
- name: Configure K3s Cluster Nodes
  hosts: all
  become: true
  tasks:
    - name: Disable swap memory
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab
      args:
        warn: false

    - name: Load required kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Configure sysctl networking parameters for Kubernetes
      ansible.builtin.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      with_dict:
        net.bridge.bridge-nf-call-iptables: 1
        net.ipv4.ip_forward: 1

- name: Initialize K3s Master Node
  hosts: master
  become: true
  tasks:
    - name: Install K3s server (master)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Retrieve K3s node token for workers
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Save token to local cache variable
      ansible.builtin.set_fact:
        token: "{{ k3s_token['content'] | b64decode | trim }}"

- name: Join K3s Worker Nodes
  hosts: workers
  become: true
  tasks:
    - name: Install K3s agent and join cluster
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://<MASTER_IP>:6443 K3S_TOKEN="{{ hostvars['master_node_name']['token'] }}" sh -
      args:
        creates: /usr/local/bin/k3s