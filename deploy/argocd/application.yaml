apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-rag
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amazen33/omni-stream-RAG-mesh.git
    targetRevision: main
    # Helm is the only application deployment source. Set the immutable image
    # tag in this reviewed Git value (or a protected values repository) rather
    # than mutating a live Deployment with kubectl set image.
    path: rag-chart
    helm:
      valueFiles:
        - values.yaml
      values: |
        mesh:
          enabled: true
          istio: {injectSidecar: true}
          spiffe: {enabled: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
