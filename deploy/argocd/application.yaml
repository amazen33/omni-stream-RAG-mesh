apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-rag
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amazen33/omni-stream-RAG-mesh.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true