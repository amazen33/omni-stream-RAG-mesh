apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: omni-stream-rag-mesh-fastapi
  namespace: rag-mesh
  labels:
    app.kubernetes.io/name: omni-stream-RAG-mesh
    app.kubernetes.io/instance: omni-stream-rag-mesh
    app.kubernetes.io/component: fastapi
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: omni-stream-RAG-mesh
      app.kubernetes.io/instance: omni-stream-rag-mesh
      app.kubernetes.io/component: fastapi
  strategy:
    canary:
      canaryService: omni-stream-rag-mesh-fastapi-canary
      stableService: omni-stream-rag-mesh-fastapi
      analysis:
        templates:
          - templateName: boundary-success-rate
        args:
          - name: service-name
            value: omni-stream-rag-mesh-fastapi
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 1m }
        - setWeight: 80
        - pause: { duration: 30s }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omni-stream-RAG-mesh
        app.kubernetes.io/instance: omni-stream-rag-mesh
        app.kubernetes.io/component: fastapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: fastapi
          image: ghcr.io/amazen33/fastapi-rag-service:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: omni-stream-rag-mesh-config
            - secretRef:
                name: omni-stream-rag-mesh-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
