apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: rag-api, namespace: rag}
spec:
  replicas: 3
  selector: {matchLabels: {app: rag-api}}
  template:
    metadata: {labels: {app: rag-api}}
    spec:
      containers: [{name: api, image: ghcr.io/example/hybrid-rag:latest, ports: [{containerPort: 8000}], readinessProbe: {httpGet: {path: /readyz, port: 8000}}}]
  strategy:
    canary:
      steps: [{setWeight: 20}, {pause: {duration: 60}}, {setWeight: 50}, {pause: {duration: 120}}]
