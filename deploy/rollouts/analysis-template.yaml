apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: boundary-success-rate
  namespace: rag-mesh
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 20s
      successCondition: result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc:9090
          query: |
            sum(rate(rag_downstream_boundary_latency_seconds_count{status="success"}[1m]))
            /
            (sum(rate(rag_downstream_boundary_latency_seconds_count[1m])) > 0 or vector(1))
---
apiVersion: v1
kind: Service
metadata:
  name: omni-stream-rag-mesh-fastapi-canary
  namespace: rag-mesh
  labels:
    app.kubernetes.io/name: omni-stream-RAG-mesh
    app.kubernetes.io/component: fastapi
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: omni-stream-RAG-mesh
    app.kubernetes.io/component: fastapi
