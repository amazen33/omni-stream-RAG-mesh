# Declarative subject contract for a Confluent-compatible Schema Registry.
# Register the Avro/Protobuf artifacts through the platform's secret-managed
# deployment job; credentials and registry URLs are never committed here.
subjects:
  - name: payments.transaction.ingested.v1-value
    format: avro
    compatibility: BACKWARD
    schema: schemas/payment_transaction_ingested.avsc
  - name: payments.risk.scored.v1-value
    format: avro
    compatibility: BACKWARD
    schema: schemas/payment_risk_scored.avsc
