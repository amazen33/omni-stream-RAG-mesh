# =============================================================================
# Ansible Inventory for 3-Node Kubernetes Cluster
# =============================================================================

[masters]
k8s-master-01 ansible_host=192.168.100.10 ansible_user=ubuntu node_type=master

[workers]
k8s-worker-01 ansible_host=192.168.100.11 ansible_user=ubuntu node_type=worker
k8s-worker-02 ansible_host=192.168.100.12 ansible_user=ubuntu node_type=worker

[k8s_cluster:children]
masters
workers

[k8s_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
master_ip=192.168.100.10
k3s_version=v1.28.5+k3s1
containerd_config_path=/etc/containerd/config.toml
