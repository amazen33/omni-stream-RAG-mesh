---
- name: Provision hybrid RAG node
  hosts: all
  become: true
  vars:
    ollama_models: ["nomic-embed-text", "llama3.2:3b"]
  tasks:
    - name: Install Docker and utilities
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - curl
        state: present
        update_cache: true

    - name: Add operator to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create persistent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - /opt/rag/minio
        - /opt/rag/ollama
        - /opt/rag/opensearch