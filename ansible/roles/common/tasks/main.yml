---
# =============================================================================
# Role: common - Node Hardening, Swap Disablement, and Kernel Setup
# =============================================================================

- name: Immediately disable swap on running system
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: false

- name: Permanently remove swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]+\s+[^#\s]+\s+swap\s+[^#\s]+\s+[^#\s]+\s+[^#\s]+)'
    replace: '# \1'

- name: Install required prerequisite packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - iptables
      - socat
      - conntrack
      - ipset
      - ethtool
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure kernel modules load on boot (/etc/modules-load.d/k8s.conf)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load overlay kernel module into running kernel
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module into running kernel
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl parameters for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl parameters immediately
  ansible.builtin.command: sysctl --system
  changed_when: false
