---
# =============================================================================
# Role: k3s_agent - Automated Worker Node Token Joining
# =============================================================================

- name: Verify cluster join token is populated
  ansible.builtin.assert:
    that:
      - k3s_token is defined
      - k3s_token | length > 0
    fail_msg: "Cluster token is missing or not registered from master node."

- name: Check if K3s agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-agent
  register: k3s_agent_binary

- name: Join worker node to K3s cluster using automated token
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ master_ip }}:6443" \
      K3S_TOKEN="{{ k3s_token }}" \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="agent \
        --node-ip {{ ansible_host }} \
        --container-runtime-endpoint unix:///run/containerd/containerd.sock" sh -
  environment:
    K3S_URL: "https://{{ master_ip }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_agent_binary.stat.exists

- name: Ensure K3s agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: yes
