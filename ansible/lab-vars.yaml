---
# Legacy K3s-only local-lab values. ansible/provision.yaml is the only playbook
# that loads this file; cloud and kubeadm mesh configuration use mesh-vars.yaml.
kubeconfig: /etc/rancher/k3s/k3s.yaml
kube_cli_argv: [k3s, kubectl]
storage_class: local-path
rag_image: localhost/rag-mesh
rag_image_tag: lab-v1
deployment_profile: onprem
waf_enabled: true
spire_trust_domain: rag.lab.internal
spire_cluster_name: rag-onprem-lab
spire_jwt_issuer: https://oidc-discovery.rag.lab.internal
spire_ca_country: ZZ
spire_ca_organization: omni-stream-rag-mesh
mesh_ingress_host: rag.internal.mesh
