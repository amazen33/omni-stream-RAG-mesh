# ---------------------------------------------------------------------------
# rag-chart values.yaml
# Every key referenced by templates/ must be defined here.
# ---------------------------------------------------------------------------

ragApi:
  replicaCount: 2
  image:
    repository: ghcr.io/amazen33/omni-stream-rag-mesh
    # Supply the SHA of a successfully scanned, published application image.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  # Cloud overlays may add a narrowly-scoped workload-identity annotation
  # (for example an EKS IRSA role). Do not put credential values in Helm.
  annotations: {}
  automountServiceAccountToken: false

# Keep mesh integration opt-in for plain local Helm use. Ansible and cloud/on-
# prem overlays enable it only after Istio and SPIRE are installed and healthy.
mesh:
  enabled: false
  istio:
    injectSidecar: false
  spiffe:
    enabled: false
    csiDriver: csi.spiffe.io
    mountPath: /run/spiffe/workload
    socketFile: agent.sock

diagnosticVerifier:
  suspend: true
  serviceAccountName: default

db:
  host: postgres.rag.svc.cluster.local
  user: rag
  password: changeme

spark:
  suspend: true

config: {}
auditInit:
  enabled: false
  # `createBucket` is true only for the disposable MinIO lab. Cloud/on-prem
  # production storage is provisioned and locked before Helm can run.
  createBucket: false
  bucket: rag-audit
  endpoint: ""
  region: us-east-1
  lockMode: COMPLIANCE
  retentionDays: 2555
  hook: post-install,post-upgrade

networkPolicy:
  enabled: true
  ingress:
    istioNamespace: istio-ingress
    monitoringNamespace: monitoring
    metricsPort: 15020
  egress:
    workloadNamespace: rag
    workloadPorts: [8000, 9000, 9092, 9200, 11434, 2113, 5432, 4317]
    istiodNamespace: istio-system
    istiodPort: 15012
    dnsNamespace: kube-system
    # Kubernetes NetworkPolicy has no FQDN primitive. Cloud overlays use this
    # only for HTTPS endpoints; production targets should replace 0.0.0.0/0
    # with approved egress-gateway or provider-private endpoint CIDRs.
    externalCIDRs: []
    externalPorts: [443]
    metadataCIDRs: []
    metadataPorts: [80]
# Legacy integration examples are not rendered without explicit opt-in.
integrations:
  kafka: false
  mirrorMaker: false
  externalSecrets: false
  certificates: false
  debezium: false
  spark: false
