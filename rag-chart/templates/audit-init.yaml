{{- if .Values.auditInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-audit-init
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: init
          image: "{{ .Values.ragApi.image.repository }}:{{ .Values.ragApi.image.tag }}"
          imagePullPolicy: {{ .Values.ragApi.image.pullPolicy }}
          envFrom: [{secretRef: {name: rag-secrets}}]
          env:
            - {name: AUDIT_BUCKET, value: {{ .Values.auditInit.bucket | quote }}}
            - {name: S3_ENDPOINT_URL, value: {{ .Values.auditInit.endpoint | quote }}}
            - {name: AWS_DEFAULT_REGION, value: {{ .Values.auditInit.region | quote }}}
            - {name: AUDIT_CREATE_BUCKET, value: {{ .Values.auditInit.createBucket | quote }}}
          command: [python, -c]
          args:
            - |
              import boto3, os
              from botocore.exceptions import ClientError
              endpoint = os.environ.get('S3_ENDPOINT_URL') or None
              s3 = boto3.client('s3', endpoint_url=endpoint, region_name=os.environ['AWS_DEFAULT_REGION'])
              bucket = os.environ['AUDIT_BUCKET']
              if os.environ['AUDIT_CREATE_BUCKET'].lower() == 'true':
                  try:
                      s3.create_bucket(Bucket=bucket, ObjectLockEnabledForBucket=True)
                  except ClientError as exc:
                      if exc.response['Error']['Code'] not in ('BucketAlreadyOwnedByYou', 'BucketAlreadyExists'):
                          raise
              s3.head_bucket(Bucket=bucket)
              # A production bucket is created and retention-governed by
              # platform Terraform, not mutated by a Helm hook.
              if endpoint:
                  lock = s3.get_object_lock_configuration(Bucket=bucket)
                  assert lock['ObjectLockConfiguration']['ObjectLockEnabled'] == 'Enabled'
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
{{- end }}
