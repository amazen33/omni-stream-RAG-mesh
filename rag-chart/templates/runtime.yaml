apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: rag-api
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: {{ .Release.Namespace }}
data:
  {{- toYaml .Values.config | nindent 2 }}
