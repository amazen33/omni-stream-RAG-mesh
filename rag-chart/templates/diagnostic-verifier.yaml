apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-diagnostic-verifier
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rag-diagnostic-verifier
    app.kubernetes.io/component: diagnostics
    app.kubernetes.io/part-of: streaming-rag-mesh
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  suspend: {{ .Values.diagnosticVerifier.suspend }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rag-diagnostic-verifier
            app.kubernetes.io/component: diagnostics
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.diagnosticVerifier.serviceAccountName | default "default" }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: verifier
              image: "{{ .Values.ragApi.image.repository }}:{{ .Values.ragApi.image.tag }}"
              imagePullPolicy: {{ .Values.ragApi.image.pullPolicy | default "IfNotPresent" }}
              command:
                - python
                - -m
                - ops.diagnostic_verifier
              envFrom:
                - configMapRef:
                    name: rag-config
                    optional: true
                - secretRef:
                    name: rag-secrets
                    optional: true
              env:
                - name: KAFKA_BOOTSTRAP_SERVERS
                  value: kafka-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092
                - name: SPARK_HEALTH_URL
                  value: http://rag-spark-history.{{ .Release.Namespace }}.svc:18080/api/v1/applications
                - name: TELEMETRY_SINK_HEALTH_URL
                  value: http://minio.{{ .Release.Namespace }}.svc:9000/minio/health/live
                - name: CHROMA_HEALTH_URL
                  value: http://chromadb.{{ .Release.Namespace }}.svc:8000/api/v2/heartbeat
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
