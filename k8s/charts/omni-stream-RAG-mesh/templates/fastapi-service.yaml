apiVersion: v1
kind: Service
metadata:
  name: {{ include "omni-stream-RAG-mesh.fullname" . }}-fastapi
  labels:
    {{- include "omni-stream-RAG-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastapi
spec:
  type: {{ .Values.fastapi.service.type }}
  ports:
    - port: {{ .Values.fastapi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "omni-stream-RAG-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fastapi
