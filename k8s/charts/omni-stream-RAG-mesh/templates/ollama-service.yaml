apiVersion: v1
kind: Service
metadata:
  name: {{ include "omni-stream-RAG-mesh.fullname" . }}-ollama
  labels:
    {{- include "omni-stream-RAG-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama-worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "omni-stream-RAG-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama-worker
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omni-stream-RAG-mesh.fullname" . }}-ollama-headless
  labels:
    {{- include "omni-stream-RAG-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama-worker
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: http
  selector:
    {{- include "omni-stream-RAG-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama-worker
