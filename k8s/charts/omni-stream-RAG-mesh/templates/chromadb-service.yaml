apiVersion: v1
kind: Service
metadata:
  name: {{ include "omni-stream-RAG-mesh.fullname" . }}-chromadb
  labels:
    {{- include "omni-stream-RAG-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: chromadb
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.chromadb.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "omni-stream-RAG-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chromadb
