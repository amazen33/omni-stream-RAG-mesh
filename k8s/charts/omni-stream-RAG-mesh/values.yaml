# =============================================================================
# omni-stream-RAG-mesh Helm Chart Values
# Distributed RAG Mesh on Kubernetes (FastAPI, Kafka KRaft, MinIO, Chroma, Ollama)
# =============================================================================

global:
  environment: production
  storageClass: ""  # Defaults to standard / local-path on K3s

# -----------------------------------------------------------------------------
# 1. FastAPI Gateway & Orchestrator
# -----------------------------------------------------------------------------
fastapi:
  replicaCount: 2
  image:
    repository: ghcr.io/amazen33/fastapi-rag-service
    tag: 1.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    DEFAULT_LLM_MODEL: "llama3.2:1b"
    DEFAULT_EMBED_MODEL: "nomic-embed-text"

# -----------------------------------------------------------------------------
# 2. Apache Kafka (KRaft Mode - ZooKeeperless)
# -----------------------------------------------------------------------------
kafka:
  replicaCount: 1
  image:
    repository: apache/kafka
    tag: 3.7.0
    pullPolicy: IfNotPresent
  clusterId: "4L622nShTUiBenVKWIRCWh"
  service:
    port: 9092
    controllerPort: 9093
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# -----------------------------------------------------------------------------
# 3. MinIO S3 Object Storage & Immutable Audit Trail
# -----------------------------------------------------------------------------
minio:
  replicaCount: 1
  image:
    repository: minio/minio
    tag: RELEASE.2024-03-30T09-41-56Z
    pullPolicy: IfNotPresent
  rootUser: "minioadmin"
  rootPassword: "minioadmin_secure_pass123!"
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    size: 20Gi
  auditTrail:
    enabled: true
    bucketName: "rag-audit-trail"
    retentionDays: 30
    mode: "COMPLIANCE"  # Enforces WORM Object Lock retention
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# -----------------------------------------------------------------------------
# 4. ChromaDB Vector Store
# -----------------------------------------------------------------------------
chromadb:
  replicaCount: 1
  image:
    repository: chromadb/chroma
    tag: 0.4.24
    pullPolicy: IfNotPresent
  service:
    port: 8000
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 1500m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# -----------------------------------------------------------------------------
# 5. Ollama LLM Worker (Scaled across worker nodes)
# -----------------------------------------------------------------------------
ollama:
  replicaCount: 2
  image:
    repository: ollama/ollama
    tag: 0.3.10
    pullPolicy: IfNotPresent
  service:
    port: 11434
  autoPullModels: true
  models:
    - "llama3.2:1b"
    - "nomic-embed-text"
  persistence:
    enabled: true
    size: 30Gi
  resources:
    limits:
      cpu: 4000m
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  # Enforces pods to spread across distinct Kubernetes worker nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - ollama-worker
            topologyKey: "kubernetes.io/hostname"

# -----------------------------------------------------------------------------
# 6. Observability & Self-Hosted LGTM Stack Integration
# -----------------------------------------------------------------------------
observability:
  serviceMonitor:
    enabled: true
    interval: "15s"
  dashboard:
    enabled: true

# -----------------------------------------------------------------------------
# 7. Ingress Routing
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: rag-mesh.local
      paths:
        - path: /
          pathType: Prefix
          service: fastapi
          port: 8000
        - path: /minio
          pathType: Prefix
          service: minio-console
          port: 9001
        - path: /ollama
          pathType: Prefix
          service: ollama
          port: 11434
  tls: []
