# Integration contract for Strimzi-managed Kafka. Deploy Schema Registry and
# MirrorMaker 2 through the selected platform operator; endpoints and TLS
# credentials remain externalized in Secrets.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: payments-replication
  namespace: rag
spec:
  version: 3.9.0
  replicas: 2
  connectCluster: dr
  clusters:
    - alias: primary
      bootstrapServers: kafka-primary-bootstrap.rag.svc:9093
      tls: {trustedCertificates: []}
    - alias: dr
      bootstrapServers: kafka-dr-bootstrap.rag.svc:9093
      tls: {trustedCertificates: []}
  mirrors:
    - sourceCluster: primary
      targetCluster: dr
      topicsPattern: "payments\\..*"
      groupsPattern: "payments-.*"
      sourceConnector: {config: {replication.factor: 3}}
      checkpointConnector: {config: {replication.factor: 3}}
      heartbeatConnector: {config: {replication.factor: 3}}
