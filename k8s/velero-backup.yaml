# On-prem/S3 profile. Prerequisites: Velero plus its AWS/S3 plugin and a CSI or
# cloud snapshot provider. The credentials Secret and bucket are supplied
# outside this repo. Choose the Azure example instead for an AKS target.
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: rag-minio
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: rag-velero-backups
    prefix: rag
  config:
    region: us-east-1
    s3ForcePathStyle: "true"
    s3Url: http://minio.rag.svc:9000
    # This is a Velero AWS-plugin setting, unlike the former inert annotation.
    serverSideEncryption: AES256
  credential:
    name: velero-minio-credentials
    key: cloud
  default: true
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: rag-daily-stateful-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    storageLocation: rag-minio
    includedNamespaces: [rag]
    snapshotVolumes: true
    defaultVolumesToFsBackup: true
    ttl: 720h0m0s
    includeClusterResources: true
