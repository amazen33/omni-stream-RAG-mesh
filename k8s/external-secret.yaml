# Requires External Secrets Operator and a SecretStore named external-secrets.
# The provider-specific SecretStore is intentionally managed outside this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-secrets
  namespace: rag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secrets
    kind: ClusterSecretStore
  target:
    name: rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: rag/runtime, property: AWS_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: rag/runtime, property: AWS_SECRET_ACCESS_KEY}
    - secretKey: PII_TOKEN_SALT
      remoteRef: {key: rag/runtime, property: PII_TOKEN_SALT}
