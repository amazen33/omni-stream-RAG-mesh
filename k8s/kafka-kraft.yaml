# Reference sketch only; it is intentionally not a deployable source. The
# supported KRaft lab is rendered from deploy/lab-infra/templates/kafka.yaml
# with the pinned Strimzi operator, node-pool API, storage class and quorum.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata: {name: kafka, namespace: rag}
spec:
  kafka: {version: 3.9.0, replicas: 3, listeners: [{name: internal, port: 9092, type: internal, tls: false}], storage: {type: persistent-claim, size: 100Gi, deleteClaim: false}, config: {auto.create.topics.enable: false, min.insync.replicas: 2}}
  entityOperator: {topicOperator: {}, userOperator: {}}
