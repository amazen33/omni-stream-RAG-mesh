apiVersion: v1
kind: Namespace
metadata: {name: rag}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: rag-config, namespace: rag}
data:
  S3_ENDPOINT_URL: http://minio.rag.svc:9000
  AUDIT_BUCKET: rag-audit
  AWS_REGION: us-east-1
  OLLAMA_BASE_URL: http://ollama.rag.svc:11434
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rag-data, namespace: rag}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Gi}}
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rag-api, namespace: rag, labels: {app: rag-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: rag-api}}
  template:
    metadata: {labels: {app: rag-api}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: ghcr.io/example/hybrid-rag:latest
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: rag-config}}, {secretRef: {name: rag-secrets}}]
        resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
        readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: rag-api, namespace: rag}
spec: {selector: {app: rag-api}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rag-default-deny, namespace: rag}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rag-api-allow, namespace: rag}
spec:
  podSelector: {matchLabels: {app: rag-api}}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}], ports: [{protocol: TCP, port: 8000}]}]
  egress: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: rag}}}], ports: [{protocol: TCP, port: 9000}, {protocol: TCP, port: 9200}, {protocol: TCP, port: 11434}]}]
